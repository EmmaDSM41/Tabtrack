buildscript {
    ext {
        buildToolsVersion = "35.0.0"
        minSdkVersion = 24
        compileSdkVersion = 35
        targetSdkVersion = 35
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.0.21"
        reactNativeReanimatedVersion = "3.6.1"
        googlePlayServicesVersion = "21.0.1"

    }

    repositories {
        google()
        mavenCentral()   // sólo Maven Central
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.8.2")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
        classpath("com.google.gms:google-services:4.4.0")

    }
}

allprojects {
    repositories {
        google()
        mavenCentral()   // sólo Maven Central
    }
}
// Forzar compileSdk para todos los subproyectos/librerías
subprojects { subproject ->
    afterEvaluate {
        if (subproject.plugins.hasPlugin('com.android.library') || subproject.plugins.hasPlugin('com.android.application')) {
            try {
                // Si el DSL usa compileSdkVersion (antiguo) o compileSdk (nuevo), lo cubrimos
                if (subproject.android.hasProperty('compileSdkVersion')) {
                    subproject.android.compileSdkVersion = rootProject.ext.compileSdkVersion
                } else {
                    subproject.android.compileSdk = rootProject.ext.compileSdkVersion
                }
            } catch (ignored) {
                // no hacer nada si no tiene 'android' o da error
            }
        }
    }
}

apply plugin: "com.facebook.react.rootproject"
