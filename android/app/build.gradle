apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply from: project(':react-native-config').projectDir.getPath() + "/dotenv.gradle"

/**
 * Configuración React Native
 */
react {
    autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = false
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'
def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.tabtrack"
    defaultConfig {
        applicationId "com.tabtrack"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 17
        versionName "2.6"
        missingDimensionStrategy 'react-native-camera', 'general'
        multiDexEnabled true
    }
    packagingOptions {
    jniLibs {
        useLegacyPackaging = false
    }
}
signingConfigs {
    debug {
        storeFile file('debug.keystore')
        storePassword 'android'
        keyAlias 'androiddebugkey'
        keyPassword 'android'
    }

    release {
        // Solo configura release si existe key.properties
        if (keystorePropertiesFile.exists()) {
            storeFile file(keystoreProperties['storeFile'])
            storePassword keystoreProperties['storePassword']
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
        } else {
            // Fallback (no recomendado) — usa debug (temporal)
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
}

buildTypes {
    debug {
        signingConfig signingConfigs.debug
    }
    release {
        signingConfig signingConfigs.release
        minifyEnabled enableProguardInReleaseBuilds
        proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
    }
}

    // <-- Agregado: forzar Java 1.8 en el compilador Java (sourceCompatibility / targetCompatibility)
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    // <-- Modificado: cambiar JVM target de Kotlin a 17 para que coincida con Java 17 en el AGP 8.8.2
    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    // RN core
    implementation("com.facebook.react:react-android")

    // Hermes vs JSC
    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }

    // ML Kit Barcode Scanning
    implementation "com.google.mlkit:barcode-scanning:17.0.2"
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation "com.google.android.gms:play-services-location:21.0.1"
  
    

 }

// Desactivar Hermes para evitar compilación JSI/CMake
project.ext.react = [
    enableHermes: false
]

// Apply the Google services plugin to enable Firebase config values from google-services.json
apply plugin: 'com.google.gms.google-services'

// vectores de iconos RN
